[package]
name = "moonsock"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Moonsock is a simple way to connect to a klipper/moonraker 3D printer websocket from anywhere where tokio can be ran and your printer is accessible from the internet."
repository = "https://github.com/rootschafer/moonsock.git"
readme = "README.md"


# [lib]
# proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = ["full", "tracing", "macros"] }
tokio-util = { version = "0.7.11", features = ["codec"] }
tokio-tungstenite = { version = ">0.21", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2.2.2"
# rand = "0.8"
rand = "0.9"
maplit = "1"

spinoff = "0.8"
# thiserror = "1"
thiserror = "2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.27.0"

